<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Notification App – Premium Shell</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Shared Top Navigation Bar -->
    <header class="top-bar">
      <div class="top-bar__brand">Job Notification App</div>
      <button
        class="top-bar__toggle"
        type="button"
        aria-label="Toggle navigation"
        aria-expanded="false"
      >
        <span class="top-bar__toggle-icon"></span>
      </button>
      <nav class="top-nav" aria-label="Primary">
        <a class="top-nav__link" href="/dashboard" data-route="/dashboard">Dashboard</a>
        <a class="top-nav__link" href="/saved" data-route="/saved">Saved</a>
        <a class="top-nav__link" href="/digest" data-route="/digest">Digest</a>
        <a class="top-nav__link" href="/settings" data-route="/settings">Settings</a>
        <a class="top-nav__link" href="/proof" data-route="/proof">Proof</a>
      </nav>
    </header>

    <!-- Routed Page Shell -->
    <main class="page-layout">
      <section class="page" id="route-view" aria-live="polite">
        <h1 class="page__title">Dashboard</h1>
        <p class="page__subtitle">
          This section will be built in the next step.
        </p>
      </section>
    </main>
  </div>

  <script>
    (function () {
      const routes = {
        "/": { title: "Dashboard" },
        "/dashboard": { title: "Dashboard" },
        "/saved": { title: "Saved" },
        "/digest": { title: "Digest" },
        "/settings": { title: "Settings" },
        "/proof": { title: "Proof" },
        "404": { title: "Page Not Found", notFound: true },
      };

      const viewEl = document.getElementById("route-view");
      const nav = document.querySelector(".top-nav");
      const toggleButton = document.querySelector(".top-bar__toggle");

      function normalisePath(path) {
        if (!path || path === "/") return "/";
        if (path.endsWith("/index.html")) return "/";
        return path;
      }

      function setActiveLink(path) {
        if (!nav) return;
        const links = nav.querySelectorAll(".top-nav__link");
        links.forEach((link) => {
          const route = link.getAttribute("data-route");
          const isDashboardAlias =
            path === "/" && route === "/dashboard";

          if (route === path || isDashboardAlias) {
            link.classList.add("top-nav__link--active");
            link.setAttribute("aria-current", "page");
          } else {
            link.classList.remove("top-nav__link--active");
            link.removeAttribute("aria-current");
          }
        });
      }

      function render(path) {
        const normalised = normalisePath(path);
        const config = routes[normalised] || routes["404"];
        const heading = config.title;
        const isNotFound = !!config.notFound;

        if (!viewEl) return;

        const titleEl = viewEl.querySelector(".page__title");
        const subtitleEl = viewEl.querySelector(".page__subtitle");

        if (titleEl) {
          titleEl.textContent = heading;
        }

        if (subtitleEl) {
          subtitleEl.textContent = isNotFound
            ? "The page you are looking for does not exist."
            : "This section will be built in the next step.";
        }

        setActiveLink(isNotFound ? "" : normalised);

        document.title = isNotFound
          ? "Page Not Found – Job Notification App"
          : heading + " – Job Notification App";
      }

      function handleLinkClick(event) {
        const target = event.target.closest("a.top-nav__link");
        if (!target || !nav.contains(target)) return;

        const href = target.getAttribute("href") || "/";
        const path = new URL(href, window.location.origin).pathname;
        const currentPath = normalisePath(window.location.pathname);

        // prevent full page reload between routes
        event.preventDefault();

        // clicking the active link should not reload or flicker
        if (normalisePath(path) === currentPath) {
          return;
        }

        window.history.pushState({}, "", path);
        render(path);

        // close mobile nav after navigation
        if (toggleButton && document.body.classList.contains("nav-open")) {
          document.body.classList.remove("nav-open");
          toggleButton.setAttribute("aria-expanded", "false");
        }
      }

      function handlePopState() {
        render(window.location.pathname);
      }

      function handleToggle() {
        if (!toggleButton) return;
        const isOpen = document.body.classList.toggle("nav-open");
        toggleButton.setAttribute("aria-expanded", String(isOpen));
      }

      if (nav) {
        nav.addEventListener("click", handleLinkClick);
      }
      if (toggleButton) {
        toggleButton.addEventListener("click", handleToggle);
      }
      window.addEventListener("popstate", handlePopState);

      // initial render, including 404 for unknown paths
      render(window.location.pathname);
    })();
  </script>
</body>
</html>
